name: Build BitFloppy firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-variants:
    name: Discover PlatformIO variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.variants.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: variants
        name: Build matrix from platformio.ini
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import configparser
          import json

          config = configparser.ConfigParser(interpolation=None)
          config.read("platformio.ini")
          environments = [
              section.removeprefix("env:")
              for section in config.sections()
              if section.startswith("env:")
          ]
          if not environments:
              raise SystemExit("No [env:<name>] sections found in platformio.ini")

          print("matrix=" + json.dumps({"environment": environments}, separators=(",", ":")))
          PY

  build:
    name: Build ${{ matrix.environment }}
    needs: discover-variants
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-variants.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run --environment "${{ matrix.environment }}"
      - name: Create diyflasher-compatible artifact
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          artifact_dir="dist/$ENVIRONMENT"
          build_dir=".pio/build/$ENVIRONMENT"
          boot_app="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"

          mkdir -p "$artifact_dir"
          cp "$build_dir/firmware.bin" "$artifact_dir/0x10000_firmware.bin"
          cp "$build_dir/bootloader.bin" "$artifact_dir/0x1000_bootloader.bin"
          cp "$build_dir/partitions.bin" "$artifact_dir/0x8000_partitions.bin"
          cp "$boot_app" "$artifact_dir/0xE000_boot_app0.bin"
          cp scripts/flash_downloaded_firmware.sh "$artifact_dir/flash_firmware.sh"
          chmod +x "$artifact_dir/flash_firmware.sh"
          sha256sum "$artifact_dir"/*.bin > "$artifact_dir/SHA256SUMS.txt"
          printf '%s\n' \
            "BitFloppy firmware for $ENVIRONMENT" \
            "" \
            "diyflasher asset layout:" \
            "  0x1000_bootloader.bin" \
            "  0x8000_partitions.bin" \
            "  0xE000_boot_app0.bin" \
            "  0x10000_firmware.bin" \
            "" \
            "Flash a connected board after extracting the artifact:" \
            "  ./flash_firmware.sh --port /dev/ttyACM0" \
            > "$artifact_dir/README.txt"
      - name: Upload ${{ matrix.environment }} firmware
        id: upload-firmware
        uses: actions/upload-artifact@v4
        with:
          name: bitfloppy-${{ matrix.environment }}-${{ github.sha }}
          path: dist/${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Add firmware download link to the build summary
        run: |
          {
            echo "## BitFloppy firmware — ${{ matrix.environment }}"
            echo
            echo "[Download this firmware artifact](${{ steps.upload-firmware.outputs.artifact-url }})"
            echo
            echo "Includes the bootloader, partition table, boot app, application firmware, SHA-256 checksums, and a local Bash flashing script."
          } >> "$GITHUB_STEP_SUMMARY"
